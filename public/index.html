<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYC GARRABRAVA</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="kyc-container">
    
    <!-- HEADER -->
    <div class="header">
      <div class="secure">
        <i data-lucide="shield-check"></i>
        <span>Pago seguro</span>
      </div>
      <h1>GARRABRAVA</h1>
      <i data-lucide="x" onclick="window.history.back()"></i>
    </div>

    <!-- INFO COMPRA -->
    <div class="info-card">
      <div>
        <p>Compra en GarraBrava.com</p>
        <p class="bold">Verificación KYC</p>
      </div>
    </div>

    <!-- STEPS -->
    <div class="steps">
      <div class="step active">1</div>
      <div class="line"></div>
      <div class="step">2</div>
      <div class="line"></div>
      <div class="step">3</div>
    </div>

    <!-- CONTENIDO -->
    <div class="content">
      <p class="subtitle">Para iniciar tu pago a cuotas</p>
      <h2 id="step-title">Verifica tu cédula</h2>

      <!-- PASO 1 -->
      <div id="step-1" class="step-content">
        <div class="id-card" onclick="document.getElementById('fileInput').click()">
          <img id="idPreview" style="display:none; width:100%; height:100%; object-fit:cover; border-radius:16px;">
          <div id="idPlaceholder">
            <i data-lucide="file-text"></i>
            <p>Toca para subir cédula</p>
          </div>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display:none">

        <p class="label">Fecha de expedición</p>
        <div class="date-selects">
          <select id="day"><option>DÍA</option></select>
          <select id="month"><option>MES</option></select>
          <select id="year"><option>AÑO</option></select>
        </div>
      </div>

      <!-- PASO 2 -->
      <div id="step-2" class="step-content" style="display:none">
        <div class="camera-frame">
          <video id="video" autoplay playsinline></video>
          <canvas id="canvas" style="display:none"></canvas>
          <div class="oval-guide"></div>
        </div>
        <button id="captureBtn" class="btn-secondary">Capturar</button>
        <button id="retakeBtn" class="btn-link" style="display:none">Repetir foto</button>
      </div>

      <!-- PASO 3 -->
      <div id="step-3" class="step-content" style="display:none">
        <div class="success">
          <i data-lucide="check-circle"></i>
          <p>Enviado a GARRABRAVA</p>
        </div>
      </div>
    </div>

    <!-- BOTON -->
    <div class="footer">
      <button id="mainBtn" class="btn-primary">Siguiente</button>
      <p class="note">Tus datos están protegidos con encriptación nivel banco</p>
    </div>

  </div>
  <script src="app.js"></script>
</body>
  </html>
